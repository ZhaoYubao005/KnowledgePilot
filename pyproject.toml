[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-pilot"
version = "1.0.0"
description = "A local project for learning and practicing LLM application development."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "chromadb==1.5.9",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["knowledge_pilot*"]
